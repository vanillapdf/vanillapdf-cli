name: vanillapdf-cli
base: core24
adopt-info: vanillapdf-cli

summary: Command-line toolkit for PDF processing, validation and digital signatures
description: |
  vanillapdf-cli is a cross-platform command-line tool for working with PDF
  documents. It merges, splits, rotates, compresses, encrypts, signs and
  validates PDFs, with one simple command per task.

  To process files on removable media, connect the removable-media plug:
    sudo snap connect vanillapdf-cli:removable-media

website: https://vanillapdf.readthedocs.io/projects/cli/
source-code: https://github.com/vanillapdf/vanillapdf-cli
issues: https://github.com/vanillapdf/vanillapdf-cli/issues
license: Apache-2.0
grade: stable
confinement: strict

# Each platform is built on a runner of that architecture, from the static Linux
# release binary the same workflow built and tested (see release.yml).
platforms:
  amd64:
  arm64:

apps:
  vanillapdf-cli:
    command: bin/vanillapdf-cli
    plugs:
      - home
      - removable-media

parts:
  vanillapdf-cli:
    # release.yml puts the release archive for this architecture here. The dump plugin
    # unpacks it and strips its top-level directory.
    plugin: dump
    source: snap/local/vanillapdf-cli.tar.gz
    stage:
      - bin/vanillapdf-cli
      - share/doc/vanillapdf-cli
    override-build: |
      craftctl default
      craftctl set-version "$("$CRAFT_PART_INSTALL/bin/vanillapdf-cli" --version)"

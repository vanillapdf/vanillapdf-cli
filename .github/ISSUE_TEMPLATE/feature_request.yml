name: ✨ Feature Request
description: Suggest a new command, option, or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your ideas! Please describe your feature proposal below.

        Note: features involving PDF parsing, encryption, or signing internals
        may belong in the [vanillapdf library](https://github.com/vanillapdf/vanillapdf)
        rather than the CLI.

  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the command, option, or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: What problem does this solve? An example command line is helpful.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Suggested Solution
      description: (Optional) How do you envision this working?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add references, prior art, or examples if applicable.
    validations:
      required: false

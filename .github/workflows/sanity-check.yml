name: Sanity check

on:
  workflow_dispatch:
  push:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanity-check.yml'
      - 'src/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
  pull_request:
    branches: [ "main", "release/*" ]
    paths:
      - '.github/workflows/sanity-check.yml'
      - 'src/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'

permissions:
  contents: read    # Download the repository source code
  packages: read    # Needed to load container images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} - ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    # Empty on Windows, which runs the job directly on the runner.
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu.26.04-x64
            os: ubuntu-24.04
            image: ghcr.io/vanillapdf/vanillapdf-ubuntu:26.04
            preset: ci
            config: Release
          - name: win.2025-x64-static
            os: windows-2025
            preset: ci-windows-static
            config: Release

    steps:
      - uses: actions/checkout@v7

      # Relative paths: github.workspace is the host path, not the path in a container.
      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: |
            build/vcpkg
            build/vcpkg_installed
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg_init.cmake') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

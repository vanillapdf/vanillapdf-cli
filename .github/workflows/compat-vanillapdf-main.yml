name: Compatibility (vanillapdf main)

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-ubuntu-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-

      - name: Configure
        run: cmake --preset vcpkg-dev

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

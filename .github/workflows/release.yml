name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.1.0). Must not exist yet."
        required: true
      dry_run:
        description: "Build and package only; do not create the tag or the release."
        type: boolean
        default: true
  # Any PR that touches this workflow triggers a build-and-package-only run so a
  # broken release pipeline is caught before it is merged. The publish job below
  # is gated to workflow_dispatch, so a PR can never create a tag or a release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions: {}

env:
  # workflow_dispatch supplies the real tag; pull_request runs have no input, so
  # fall back to a placeholder that only affects the package file names.
  TAG: ${{ github.event.inputs.tag || 'dry-run' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The top-level permissions are {}; grant just enough for actions/checkout to
    # read the repository (required on private repos, harmless on public ones).
    permissions:
      contents: read
    # Build against the newest SDK but pin the runtime floor: MACOSX_DEPLOYMENT_TARGET
    # is honoured by clang/ld, seeds CMAKE_OSX_DEPLOYMENT_TARGET, and is passed to the
    # vcpkg port builds, so the CLI, the library, and all deps target the same minimum.
    # Empty on non-Apple runners, where it is ignored.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            preset: ci
            cpack_gen: TGZ
          - name: windows-x64
            os: windows-2025
            preset: ci-windows-static
            cpack_gen: ZIP
          - name: macos-arm64
            os: macos-26
            preset: ci
            cpack_gen: TGZ
            macos_deployment_target: "14.0"
          - name: macos-x64
            os: macos-26-intel
            preset: ci
            cpack_gen: TGZ
            macos_deployment_target: "14.0"

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/build/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-release-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-release-${{ matrix.name }}-

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DVANILLAPDF_CLI_ENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package archive
        shell: bash
        run: >
          cpack --config build/CPackConfig.cmake
          -G ${{ matrix.cpack_gen }}
          -C Release
          -D CPACK_PACKAGE_FILE_NAME="vanillapdf-cli-${TAG}-${{ matrix.name }}"
          -B "$PWD"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            vanillapdf-cli-*.zip
            vanillapdf-cli-*.tar.gz
            vanillapdf-cli-*.sha256
          if-no-files-found: error

  release:
    name: Tag and create draft release
    needs: build
    # Publish only on a manual dispatch with dry_run disabled. Pull-request runs
    # (which touch this workflow) and dry runs stop after the build job, which
    # still uploads the archives as workflow artifacts for inspection.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the tag, create the release and upload assets
      id-token: write       # keyless signing for provenance
      attestations: write   # artifact attestations

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          git config user.name "vanillapdf-bot"
          git config user.email "info@vanillapdf.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release from tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags containing a hyphen (e.g. v1.0.0-beta.1) are pre-releases.
          PRERELEASE=""
          [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$TAG" \
            --title "vanillapdf-cli $TAG" \
            --generate-notes \
            --draft \
            $PRERELEASE

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dependency-graph/sbom" \
            | jq '.sbom' > "vanillapdf-cli-${TAG}-sbom.spdx.json"

      - name: Upload SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "vanillapdf-cli-${TAG}-sbom.spdx.json" --clobber

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
          sbom-path: vanillapdf-cli-${{ env.TAG }}-sbom.spdx.json
